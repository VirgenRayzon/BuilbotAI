name: Buildbot AI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "dummy-key-for-ci"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "buildbot-demo.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "buildbot-demo"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "buildbot-demo.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:abcdef"
      NEXT_PUBLIC_APP_URL: "https://buildbot.ph"
      GEMINI_API_KEY: "dummy-gemini-key-for-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Lint
        run: npm run lint

      - name: Run Production Build
        run: npm run build
